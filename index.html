<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>夜の商店街・無限加速サバイバル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #05080f;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen w-screen p-2 box-border">

    <!-- ヘッダー / ステータス -->
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-700/80 rounded-xl p-2.5 flex justify-between items-center shadow-lg backdrop-blur shrink-0 z-10">
        <div>
            <h1 class="text-sm font-extrabold text-amber-500">🏮 無限加速サバイバル</h1>
            <p id="score-indicator" class="text-[10px] text-slate-400">距離: 0m | 時間: 0秒 | 速度: 1.0x</p>
        </div>
        <div class="flex gap-2 text-xs font-bold items-center">
            <div class="bg-amber-950/60 px-2.5 py-1 rounded border border-amber-600/50 text-amber-300">
                🪙 <span id="coin-display">0</span>/10
            </div>
            <div class="bg-slate-950 px-3 py-1 rounded border border-slate-800 text-rose-400 tracking-wider text-sm">
                <span id="heart-display">❤️❤️❤️❤️❤️</span>
            </div>
        </div>
    </div>

    <!-- 3Dゲーム描画コンテナ -->
    <div id="canvas-container" class="relative w-full max-w-md aspect-[1/1] bg-slate-950 border-2 border-slate-700/80 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center my-auto">
        <!-- 無敵状態の視覚演出バナー -->
        <div id="invincible-banner" class="absolute top-3 inset-x-0 flex justify-center pointer-events-none opacity-0 transition-opacity duration-300 z-20">
            <span class="bg-gradient-to-r from-red-500 via-yellow-400 via-green-400 via-blue-500 to-purple-500 text-slate-950 font-extrabold px-4 py-1 rounded-full text-xs shadow-lg animate-bounce">
                ✨ 虹色無敵モード発動中！ (<span id="invincible-timer">10</span>秒) ✨
            </span>
        </div>

        <!-- スタート画面のオーバーレイ -->
        <div id="overlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center z-30">
            <h2 id="overlay-title" class="text-2xl font-extrabold text-amber-400 mb-2">無限加速＆大ジャンプカエル！</h2>
            <p id="overlay-desc" class="text-xs text-slate-300 mb-6 leading-relaxed max-w-xs">
                10秒経過ごとにスピードが1.2倍ずつ果てしなく加速していくぞ！<br>
                カエルゾンビは超高空へ大ジャンプして頭上を飛び越えていく！
            </p>
            <button id="action-btn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-6 py-3 rounded-xl text-base shadow-lg transition transform active:scale-95 cursor-pointer">
                ゲームスタート
            </button>
        </div>
    </div>

    <!-- 左右移動コントロール -->
    <div class="w-full max-w-md flex justify-between items-center px-6 pb-4 shrink-0 h-28 z-10">
        <button id="left-btn" class="w-32 h-16 bg-slate-800 active:bg-slate-600 border border-slate-600 rounded-xl flex items-center justify-center text-2xl text-white shadow-xl touch-none">⬅️ 左</button>
        <button id="right-btn" class="w-32 h-16 bg-slate-800 active:bg-slate-600 border border-slate-600 rounded-xl flex items-center justify-center text-2xl text-white shadow-xl touch-none">右 ➡️</button>
    </div>

    <script>
        let scene, camera, renderer;
        let gameState = 'START';
        let distanceRun = 0;
        let gameTime = 0;
        let timerInterval = null;

        let playerSprite;
        let playerLane = 1;
        const lanes = [-2.0, 0, 2.0];
        let playerTargetX = 0;
        let playerHearts = 5;
        let stepCycle = 0;

        let coinCount = 0;
        let isInvincible = false;
        let invincibleTimeLeft = 0;
        let invincibleInterval = null;

        let obstacleGroups = [];
        let playerTexture, zombieTexture, wideZombieTexture, frogZombieTexture, coinTexture, rainbowPlayerTexture;

        let audioCtx = null;
        let bgmInterval = null;

        function startAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCoinSE() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }

        function playHitSE() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let oscGain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);

                oscGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                osc.connect(oscGain);
                oscGain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);

                let bufferSize = audioCtx.sampleRate * 0.15;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
                }

                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);

                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            } catch (e) {}
        }

        function startBonodoriBGM() {
            stopBGM();
            startAudioEngine();
            try {
                const bonodoriScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
                let beatStep = 0;

                bgmInterval = setInterval(() => {
                    if (gameState !== 'PLAYING' || !audioCtx) return;

                    let isDon = (beatStep % 4 === 0 || beatStep % 4 === 2);
                    let drumOsc = audioCtx.createOscillator();
                    let drumGain = audioCtx.createGain();

                    drumOsc.type = isDon ? 'triangle' : 'sine';
                    drumOsc.frequency.setValueAtTime(isDon ? 75 : 180, audioCtx.currentTime);
                    drumOsc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.2);

                    drumGain.gain.setValueAtTime(isDon ? 0.3 : 0.15, audioCtx.currentTime);
                    drumGain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

                    drumOsc.connect(drumGain);
                    drumGain.connect(audioCtx.destination);
                    drumOsc.start();
                    drumOsc.stop(audioCtx.currentTime + 0.2);

                    if (beatStep % 2 === 0) {
                        let fluteOsc = audioCtx.createOscillator();
                        let fluteGain = audioCtx.createGain();
                        fluteOsc.type = 'sine';
                        let note = bonodoriScale[Math.floor(Math.random() * bonodoriScale.length)];
                        fluteOsc.frequency.setValueAtTime(note * 1.5, audioCtx.currentTime);

                        fluteGain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                        fluteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                        fluteOsc.connect(fluteGain);
                        fluteGain.connect(audioCtx.destination);
                        fluteOsc.start();
                        fluteOsc.stop(audioCtx.currentTime + 0.3);
                    }

                    beatStep = (beatStep + 1) % 32;
                }, 280);
            } catch (e) {}
        }

        function stopBGM() {
            if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
        }

        function updateHeartDisplay() {
            let heartsStr = '';
            for (let i = 0; i < 5; i++) {
                heartsStr += (i < playerHearts) ? '❤️' : '🖤';
            }
            document.getElementById('heart-display').innerText = heartsStr;
        }

        function createCharacterTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = type === 'wide' ? 256 : 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (type === 'player' || type === 'rainbow') {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(64, 115, 25, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(48, 85, 12, 30);
                ctx.fillRect(68, 85, 12, 30);

                let shirtColor = '#2563eb';
                if (type === 'rainbow') {
                    let grad = ctx.createLinearGradient(0, 0, 128, 128);
                    grad.addColorStop(0, '#ef4444'); grad.addColorStop(0.2, '#f59e0b'); grad.addColorStop(0.4, '#10b981'); grad.addColorStop(0.6, '#3b82f6'); grad.addColorStop(0.8, '#8b5cf6'); grad.addColorStop(1, '#ec4899');
                    shirtColor = grad;
                }
                ctx.fillStyle = shirtColor;
                ctx.fillRect(40, 45, 48, 42);

                ctx.fillStyle = type === 'rainbow' ? '#fef08a' : '#1d4ed8';
                ctx.fillRect(58, 45, 12, 42);
                ctx.fillStyle = '#78350f';
                ctx.fillRect(44, 8, 40, 38);
                ctx.fillStyle = '#92400e';
                ctx.fillRect(48, 12, 32, 26);
            } else if (type === 'zombie') {
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(64, 115, 25, 10, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#3f6212'; ctx.fillRect(48, 85, 11, 30); ctx.fillRect(69, 85, 11, 30);
                ctx.fillStyle = '#365314'; ctx.beginPath(); ctx.roundRect(38, 45, 52, 45, 8); ctx.fill();
                ctx.fillStyle = '#991b1b'; ctx.fillRect(55, 60, 18, 8);
                ctx.fillStyle = '#65a30d'; ctx.fillRect(20, 38, 25, 12); ctx.fillRect(83, 38, 25, 12);
                ctx.fillStyle = '#a3e635'; ctx.beginPath(); ctx.arc(64, 25, 18, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#1a2e05'; ctx.fillRect(48, 8, 32, 10);
            } else if (type === 'frog') {
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(64, 115, 25, 10, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#15803d'; ctx.fillRect(48, 85, 11, 30); ctx.fillRect(69, 85, 11, 30);
                ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.roundRect(38, 45, 52, 45, 12); ctx.fill();
                ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(52, 22, 10, 0, Math.PI * 2); ctx.arc(76, 22, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(52, 22, 4, 0, Math.PI * 2); ctx.arc(76, 22, 4, 0, Math.PI * 2); ctx.fill();
            } else if (type === 'wide') {
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(128, 115, 60, 12, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#14532d'; ctx.fillRect(80, 80, 20, 35); ctx.fillRect(156, 80, 20, 35);
                ctx.fillStyle = '#064e3b'; ctx.beginPath(); ctx.roundRect(50, 40, 156, 45, 8); ctx.fill();
                ctx.fillStyle = '#7f1d1d'; ctx.fillRect(100, 55, 56, 12);
                ctx.fillStyle = '#047857'; ctx.fillRect(10, 35, 45, 15); ctx.fillRect(201, 35, 45, 15);
                ctx.fillStyle = '#34d399'; ctx.beginPath(); ctx.arc(128, 22, 20, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#022c22'; ctx.fillRect(104, 2, 48, 12);
            } else if (type === 'coin') {
                ctx.fillStyle = '#eab308'; ctx.beginPath(); ctx.arc(64, 64, 30, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 6; ctx.stroke();
                ctx.fillStyle = '#fef08a'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('🪙', 64, 64);
            }

            return new THREE.CanvasTexture(canvas);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const actionBtn = document.getElementById('action-btn');
            const leftBtn = document.getElementById('left-btn');
            const rightBtn = document.getElementById('right-btn');

            if (actionBtn) {
                actionBtn.addEventListener('click', (e) => { e.preventDefault(); startGame(); });
                actionBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });
            }
            if (leftBtn) { leftBtn.addEventListener('click', (e) => { e.preventDefault(); movePlayer(-1); }); }
            if (rightBtn) { rightBtn.addEventListener('click', (e) => { e.preventDefault(); movePlayer(1); }); }

            window.addEventListener('keydown', (e) => {
                if (['ArrowLeft', 'a', 'A'].includes(e.key)) { e.preventDefault(); movePlayer(-1); }
                if (['ArrowRight', 'd', 'D'].includes(e.key)) { e.preventDefault(); movePlayer(1); }
            });
        });

        function movePlayer(direction) {
            if (gameState !== 'PLAYING') return;
            playerLane += direction;
            if (playerLane < 0) playerLane = 0;
            if (playerLane > 2) playerLane = 2;
            playerTargetX = lanes[playerLane];
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05080f);
            scene.fog = new THREE.FogExp2(0x05080f, 0.04);

            camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
            camera.position.set(0, 2.5, 4);
            camera.lookAt(0, 1, -6);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            playerTexture = createCharacterTexture('player');
            rainbowPlayerTexture = createCharacterTexture('rainbow');
            zombieTexture = createCharacterTexture('zombie');
            frogZombieTexture = createCharacterTexture('frog');
            wideZombieTexture = createCharacterTexture('wide');
            coinTexture = createCharacterTexture('coin');
        }

        function startGame() {
            startBonodoriBGM();

            playerHearts = 5;
            distanceRun = 0;
            gameTime = 0;
            coinCount = 0;
            isInvincible = false;
            invincibleTimeLeft = 0;
            if (invincibleInterval) clearInterval(invincibleInterval);

            playerLane = 1;
            playerTargetX = lanes[1];
            stepCycle = 0;

            document.getElementById('coin-display').innerText = coinCount;
            updateHeartDisplay();
            document.getElementById('invincible-banner').classList.add('opacity-0');

            if (!scene) init3D();

            while(scene.children.length > 0){ scene.remove(scene.children[0]); }
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const roadGeo = new THREE.PlaneGeometry(8, 400);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0, -150);
            scene.add(road);

            const bMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            for (let z = 5; z > -200; z -= 10) {
                [-5.5, 5.5].forEach(bx => {
                    const bGeo = new THREE.BoxGeometry(4, 8, 9);
                    const bMesh = new THREE.Mesh(bGeo, bMat);
                    bMesh.position.set(bx, 4, z);
                    scene.add(bMesh);

                    let lLight = new THREE.PointLight(0xf97316, 1.8, 12);
                    lLight.position.set(bx * 0.75, 3.5, z);
                    scene.add(lLight);
                });
            }

            const pMat = new THREE.SpriteMaterial({ map: playerTexture });
            playerSprite = new THREE.Sprite(pMat);
            playerSprite.scale.set(1.8, 1.8, 1);
            playerSprite.position.set(lanes[1], 0.9, 0);
            scene.add(playerSprite);

            obstacleGroups = [];
            for (let i = 0; i < 6; i++) {
                spawnWave(-30 - (i * 22));
            }

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameState === 'PLAYING') gameTime++;
            }, 1000);

            gameState = 'PLAYING';
            const overlay = document.getElementById('overlay');
            if (overlay) overlay.classList.add('hidden');
            animate();
        }

        function spawnWave(zPos) {
            let waveZ = zPos;
            let zombiesInWave = [];
            let coinsInWave = [];

            let allowWide = (gameTime >= 40);
            let allowFrog = (gameTime >= 25);
            let isWideWave = allowWide && (Math.random() < 0.25);
            let isFrogWave = allowFrog && !isWideWave && (Math.random() < 0.35);

            if (isWideWave) {
                let pairType = Math.random() < 0.5 ? 0 : 1;
                let occupiedLanes = pairType === 0 ? [0, 1] : [1, 2];
                let safeLane = pairType === 0 ? 2 : 0;

                let mat = new THREE.SpriteMaterial({ map: wideZombieTexture });
                let sprite = new THREE.Sprite(mat);
                sprite.scale.set(3.4, 1.8, 1);
                let targetX = pairType === 0 ? -1.0 : 1.0;
                sprite.position.set(targetX, 0.9, waveZ);
                scene.add(sprite);

                zombiesInWave.push({
                    sprite: sprite, isWide: true, occupiedLanes: occupiedLanes, z: waveZ, baseLane: pairType === 0 ? 0 : 1, hitRegistered: false
                });

                let cMat = new THREE.SpriteMaterial({ map: coinTexture });
                let cSprite = new THREE.Sprite(cMat);
                cSprite.scale.set(1.2, 1.2, 1);
                cSprite.position.set(lanes[safeLane], 0.9, waveZ + 6);
                scene.add(cSprite);
                coinsInWave.push({ sprite: cSprite, lane: safeLane, z: waveZ + 6, collected: false });

            } else {
                let safeLane = Math.floor(Math.random() * 3);
                for (let l = 0; l < 3; l++) {
                    if (l === safeLane) {
                        let cMat = new THREE.SpriteMaterial({ map: coinTexture });
                        let cSprite = new THREE.Sprite(cMat);
                        cSprite.scale.set(1.2, 1.2, 1);
                        cSprite.position.set(lanes[l], 0.9, waveZ + 6);
                        scene.add(cSprite);
                        coinsInWave.push({ sprite: cSprite, lane: l, z: waveZ + 6, collected: false });
                        continue;
                    }

                    let useFrog = isFrogWave && (Math.random() < 0.6);
                    let mat = new THREE.SpriteMaterial({ map: useFrog ? frogZombieTexture : zombieTexture });
                    let sprite = new THREE.Sprite(mat);
                    sprite.scale.set(1.8, 1.8, 1);
                    sprite.position.set(lanes[l], 0.9, waveZ);
                    scene.add(sprite);

                    zombiesInWave.push({
                        sprite: sprite, isWide: false, isFrog: useFrog, lane: l, z: waveZ, baseLane: l, jumpCycle: Math.random() * Math.PI, hitRegistered: false
                    });
                }
            }

            obstacleGroups.push({ zombies: zombiesInWave, coins: coinsInWave });
        }

        function activateInvincibleMode() {
            isInvincible = true;
            invincibleTimeLeft = 10;
            playerSprite.material.map = rainbowPlayerTexture;
            document.getElementById('invincible-banner').classList.remove('opacity-0');
            document.getElementById('invincible-timer').innerText = invincibleTimeLeft;

            if (invincibleInterval) clearInterval(invincibleInterval);
            invincibleInterval = setInterval(() => {
                invincibleTimeLeft--;
                const timerEl = document.getElementById('invincible-timer');
                if (timerEl) timerEl.innerText = invincibleTimeLeft;

                if (invincibleTimeLeft <= 0) {
                    clearInterval(invincibleInterval);
                    isInvincible = false;
                    playerSprite.material.map = playerTexture;
                    document.getElementById('invincible-banner').classList.add('opacity-0');
                }
            }, 1000);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            stopBGM();
            if (timerInterval) clearInterval(timerInterval);
            if (invincibleInterval) clearInterval(invincibleInterval);
            document.getElementById('overlay-title').innerText = "ゲームオーバー";
            document.getElementById('overlay-desc').innerText = `ゾンビに5回触れて力尽きてしまった...\n生存距離: ${Math.floor(distanceRun)}m (生存時間: ${gameTime}秒)`;
            document.getElementById('action-btn').innerText = "もう一度挑戦";
            document.getElementById('overlay').classList.remove('hidden');
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            distanceRun += 0.2;
            
            // 10秒経過ごとに速度が1.2倍ずつ果てしなく加速していくシステム
            let speedMultiplier = Math.pow(1.2, Math.floor(gameTime / 10));
            let currentSpeed = (0.16 + (gameTime * 0.0003)) * speedMultiplier;

            document.getElementById('score-indicator').innerText = `距離: ${Math.floor(distanceRun)}m | 時間: ${gameTime}秒 | 速度: ${speedMultiplier.toFixed(1)}x`;

            playerSprite.position.x += (playerTargetX - playerSprite.position.x) * 0.25;
            stepCycle += 0.35;
            playerSprite.position.y = 0.9 + Math.abs(Math.sin(stepCycle)) * 0.15;

            // カメラ位置は常に背後からの固定視点
            camera.position.set(0, 2.5, 4);
            camera.lookAt(0, 1, -6);

            let isDiagonalActive = (gameTime >= 45);

            obstacleGroups.forEach((group, groupIdx) => {
                let wavePassed = true;

                group.coins.forEach(c => {
                    c.z += currentSpeed;
                    c.sprite.position.z = c.z;
                    if (c.z < 6) wavePassed = false;

                    if (!c.collected && Math.abs(c.z - playerSprite.position.z) < 0.9 && playerLane === c.lane) {
                        c.collected = true;
                        scene.remove(c.sprite);
                        playCoinSE();
                        coinCount++;
                        document.getElementById('coin-display').innerText = coinCount;

                        if (coinCount >= 10) {
                            coinCount -= 10;
                            document.getElementById('coin-display').innerText = coinCount;
                            activateInvincibleMode();
                        }
                    }
                });

                group.zombies.forEach(z => {
                    z.z += currentSpeed;

                    let isGrounded = true;
                    if (z.isFrog) {
                        z.jumpCycle = (z.jumpCycle || 0) + 0.1;
                        let jumpHeight = Math.sin(z.jumpCycle);
                        if (jumpHeight > 0) {
                            z.sprite.position.y = 0.9 + jumpHeight * 5.0; // 超高空大ジャンプ
                            isGrounded = false;
                        } else {
                            z.sprite.position.y = 0.9;
                            isGrounded = true;
                        }
                    }

                    if (isDiagonalActive && !z.isFrog) {
                        let currentX = z.sprite.position.x;
                        z.sprite.position.x += (targetXForZombie(z, playerLane) - currentX) * 0.015;
                    }
                    z.sprite.position.z = z.z;
                    if (z.z < 6) wavePassed = false;

                    let hit = false;
                    let currentLaneIdx = Math.round((z.sprite.position.x + 2.0) / 2.0);
                    currentLaneIdx = Math.max(0, Math.min(2, currentLaneIdx));

                    if (Math.abs(z.z - playerSprite.position.z) < 0.8 && !z.hitRegistered) {
                        if (z.isFrog && !isGrounded) {
                            hit = false;
                        } else if (z.isWide) {
                            let occupied = z.occupiedLanes || [0, 1];
                            if (occupied.includes(playerLane)) hit = true;
                        } else {
                            if (playerLane === currentLaneIdx) hit = true;
                        }
                    }

                    if (hit) {
                        z.hitRegistered = true;
                        playHitSE();
                        if (isInvincible) {
                            z.z = -180;
                        } else {
                            playerHearts--;
                            updateHeartDisplay();
                            if (playerHearts <= 0) {
                                gameOver();
                            }
                        }
                    }
                });

                if (wavePassed && group.zombies.length > 0 && group.zombies[0].z > 6) {
                    group.zombies.forEach(z => scene.remove(z.sprite));
                    group.coins.forEach(c => scene.remove(c.sprite));
                    obstacleGroups.splice(groupIdx, 1);
                    spawnWave(-180 - Math.random() * 20);
                }
            });
        }

        function targetXForZombie(z, pLane) {
            if (z.isWide) {
                return z.baseLane === 0 ? -1.0 : 1.0;
            } else {
                let playerX = lanes[pLane];
                let baseOrigX = lanes[z.baseLane];
                let clampedX = baseOrigX + Math.sign(playerX - baseOrigX) * Math.min(Math.abs(playerX - baseOrigX), 0.8);
                return clampedX;
            }
        }

        function animate() {
            if (gameState === 'PLAYING') {
                update();
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
        }
    </script>
</body>
